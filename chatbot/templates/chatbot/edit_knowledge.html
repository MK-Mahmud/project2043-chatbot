{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Edit Knowledge

</title>

<link rel="stylesheet"
href="{% static 'dashboard/css/dashboard.css' %}">

</head>

<body>

<div class="header">

<h1>

✏ Edit Knowledge Base Record

</h1>

<p>

Update chatbot questions and responses

</p>

</div>

<div class="container">

<div class="chart-box">

<form method="POST">

{% csrf_token %}

<label><strong>Intent</strong></label>

<select name="intent" required>

{% for intent in intents %}

<option value="{{ intent.id }}"
{% if knowledge.intent.id == intent.id %}selected{% endif %}>

{{ intent.intent_name }}

</option>

{% endfor %}

</select>

<br><br>

<label><strong>English Question</strong></label>

<textarea
name="question_en"
rows="3"
required>{{ knowledge.question_en }}</textarea>

<br><br>

<label><strong>Hausa Question</strong></label>

<textarea
name="question_ha"
rows="3"
required>{{ knowledge.question_ha }}</textarea>

<br><br>

<label><strong>English Answer</strong></label>

<textarea
name="answer_en"
rows="5"
required>{{ knowledge.answer_en }}</textarea>

<br><br>

<label><strong>Hausa Answer</strong></label>

<textarea
name="answer_ha"
rows="5"
required>{{ knowledge.answer_ha }}</textarea>

<br><br>

<button
type="submit"
class="btn">

💾 Update Knowledge

</button>

<a
href="{% url 'knowledge_base' %}"
class="btn"
style="background:#6c757d;">

Cancel

</a>

</form>

</div>

</div>

</body>

</html>
