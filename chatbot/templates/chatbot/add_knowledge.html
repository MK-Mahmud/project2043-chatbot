{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        Add Knowledge

    </title>

    <link rel="stylesheet"
          href="{% static 'dashboard/css/dashboard.css' %}">

</head>

<body>

<div class="header">

    <h1>

        ➕ Add Knowledge Base Record

    </h1>

    <p>

        Add a new chatbot question and response

    </p>

</div>

<div class="container">

<div class="chart-box">

<form method="POST">

{% csrf_token %}

<label>

<strong>Intent</strong>

</label>

<select name="intent" required>

<option value="">

Select Intent

</option>

{% for intent in intents %}

<option value="{{ intent.id }}">

{{ intent.intent_name }}

</option>

{% endfor %}

</select>

<br><br>

<label>

<strong>English Question</strong>

</label>

<textarea

name="question_en"

rows="3"

required>

</textarea>

<br><br>

<label>

<strong>Hausa Question</strong>

</label>

<textarea

name="question_ha"

rows="3"

required>

</textarea>

<br><br>

<label>

<strong>English Answer</strong>

</label>

<textarea

name="answer_en"

rows="5"

required>

</textarea>

<br><br>

<label>

<strong>Hausa Answer</strong>

</label>

<textarea

name="answer_ha"

rows="5"

required>

</textarea>

<br><br>

<button

type="submit"

class="btn">

💾 Save Knowledge

</button>

<a

href="{% url 'knowledge_base' %}"

class="btn"

style="background:#6c757d;">

Cancel

</a>

</form>

</div>

</div>

</body>

</html>
