{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f7fb;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#333;
        }

        .login-card{
            background:#ffffff;
            width:100%;
            max-width:420px;
            padding:40px 36px;
            border-radius:14px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
            text-align:center;
        }

        .login-card .logo{
            font-size:42px;
            margin-bottom:6px;
        }

        .login-card h1{
            color:#003366;
            font-size:26px;
            margin-bottom:4px;
        }

        .login-card p.subtitle{
            color:#666;
            margin-bottom:28px;
        }

        .form-group{
            text-align:left;
            margin-bottom:18px;
        }

        .form-group label{
            display:block;
            font-weight:bold;
            margin-bottom:6px;
            font-size:14px;
        }

        .form-group input{
            width:100%;
            padding:12px 14px;
            border:1px solid #cfd8e3;
            border-radius:8px;
            font-size:15px;
        }

        .form-group input:focus{
            outline:none;
            border-color:#003366;
        }

        .login-btn{
            width:100%;
            padding:13px;
            background:#003366;
            color:#fff;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            margin-top:8px;
        }

        .login-btn:hover{
            background:#002347;
        }

        .error-box{
            background:#fdecea;
            color:#b3261e;
            border:1px solid #f5c2c0;
            padding:10px 14px;
            border-radius:8px;
            margin-bottom:18px;
            font-size:14px;
            text-align:left;
        }

        .back-link{
            display:block;
            margin-top:20px;
            color:#003366;
            font-weight:bold;
            text-decoration:none;
        }

        .footer-note{
            margin-top:24px;
            font-size:12px;
            color:#999;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="logo">🏢</div>
        <h1>ABC BANK PLC</h1>
        <p class="subtitle">Administrator Login</p>

        {% if form.errors %}
        <div class="error-box">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" autofocus required>
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required>
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="{% url 'home' %}" class="back-link">&larr; Return to Chatbot</a>

        <p class="footer-note">
            AI Customer Support System<br>
            Department of Computer Science
        </p>

    </div>

</body>
</html>
